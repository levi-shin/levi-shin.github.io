name: Auto Update Patch Notes

on:
  schedule:
    # 한국 시간(KST) 매일 오전 6:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:       # 수동 실행

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: |
          pip install curl_cffi beautifulsoup4 requests

      - name: 크롤러 실행
        run: |
          python crawler.py

      - name: Git 커밋, 푸시 및 Slack 알림
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/patchnotes.json
          
          if ! git diff --cached --quiet; then
            git commit -m "feat: 최신 패치 노트 자동 갱신 (data/patchnotes.json)"
            git push
            
            # Slack 알림 전송
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🚀 *디아블로 II: 레저렉션 최신 패치 노트 업데이트 완료!*\n`data/patchnotes.json` 파일이 최신 정보로 갱신되었습니다."}' \
              $SLACK_WEBHOOK_URL
          else
            echo "새로운 패치 노트가 없습니다."
          fi
