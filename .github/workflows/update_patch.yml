name: Auto Update Patch Notes

on:
  schedule:
    - cron: '0 21 * * *'  # 한국 시간 매일 오전 6시
  workflow_dispatch:       # 수동 실행

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: |
          pip install requests beautifulsoup4

      - name: 크롤러 실행 (데이터 갱신 및 Slack 알림)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python crawler.py

      - name: Git 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/patchnotes.json
          
          if ! git diff --cached --quiet; then
            git commit -m "feat: 최신 패치 노트 자동 갱신 (data/patchnotes.json)"
            git push
          else
            echo "새로운 패치 노트가 없습니다."
          fi
